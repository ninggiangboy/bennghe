         "text": "Agent Go cài bằng một lệnh, enroll bằng token dùng một lần, xác thực **hai chiều** với control plane qua WebSocket, chỉ áp desired state có chữ ký của control plane, có một reconciler duy nhất cho trạng thái cấp cụm, tự cập nhật an toàn (watchdog, chống hạ cấp, kênh chỉ-cập-nhật cho agent quá cũ), chịu được control plane offline lâu và control plane được restore từ backup."
