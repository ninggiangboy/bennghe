       "text": "Registry nội bộ mỗi cụm + build node."
      },
      {
       "text": "Git native: GitHub App (GitHub.com + GHES), GitLab, Gitea; Forgejo best-effort qua adapter Gitea."
      },
      {
       "text": "Cloudflare: DNS tự động, DNS-01/wildcard, Tunnel, preset R2."
      },
