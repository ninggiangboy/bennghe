        {
         "type": "text",
         "variant": "lead",
         "text": "Có monorepo chạy được: control plane Go phục vụ SPA React qua TLS của chính nó, đăng nhập có bảo vệ màn hình setup, RBAC theo scope với cổng CI bắt mọi route khai báo quyền, audit cho cả thao tác thành công lẫn bị từ chối, contract phát sự kiện, job queue, lab test Incus, và CI xanh."
        },
        {
         "type": "list",
         "title": "Yêu cầu",
         "items": [
          {
           "text": "Một Go module; các binary `cmd/controlplane`, `cmd/agent` (stub), `cmd/healthcheck` và `cmd/envexec` (stub, dùng ở phase 5)."
          },
          {
           "text": "Control plane: chi router, cấu hình qua env + file, Postgres qua pgx v5, sqlc, goose với migration đặt tên theo timestamp (`YYYYMMDDHHMMSS_<name>.sql`, chỉ đi tiến) để các phase chạy song song không va số. River cho job queue."
          },
          {
           "text": "API spec-first: `api/openapi.yaml` → oapi-codegen (strict server) cho Go, openapi-typescript + openapi-fetch cho web. Mọi operation phải có `x-permission: {action, scope}`."
          },
          {
           "text": "RBAC: vai trò `owner | admin | developer | viewer`, scope `global | cluster | project`. Project là ranh giới cách ly bảo mật thật (người dùng chốt 2026-11-26): developer của project A không đọc/ghi được tài nguyên của project B. Ma trận quyền trong `internal/cp/rbac/policy.go`; middleware đọc `x-permission` của route. Test `TestAllRoutes` duyệt mọi operation × mọi vai trò và là cổng CI: route mới thiếu `x-permission` hoặc thiếu dòng trong ma trận làm CI đỏ. Các thao tác đọc nhạy cảm (log, connection string, xem secret, recovery kit) có action riêng, không gộp vào \"read\"."
          },
          {
           "text": "Audit: `audit.Record(ctx, tx, ...)` cho thao tác ghi thành công (cùng transaction); `audit.RecordDenied(ctx, pool, ...)` được middleware RBAC gọi trong transaction riêng cho mọi request bị từ chối; đọc nhạy cảm cũng được ghi."
          },
          {
           "text": "Sự kiện: `events.Emit(ctx, tx, Event)` chèn một River job trong cùng transaction với thao tác. Mọi phase sau phát sự kiện qua hàm này; phase 8 chỉ thêm phần tiêu thụ (quy tắc + kênh thông báo). Không dựng bus riêng."
          },
          {
           "text": "Auth: user local (argon2id), session cookie HttpOnly + SameSite=Lax, CSRF token, rate limit đăng nhập. Setup token: install script sinh token dùng một lần, in ra terminal, lưu dạng hash; `/setup` đòi token này và vô hiệu sau khi tạo owner."
          },
          {
           "text": "Mã hoá secret at-rest: AES-256-GCM, AAD = tên bảng + id bản ghi, master key 32 byte đọc từ file 0600, cột `key_id` cho việc xoay khoá."
          },
          {
           "text": "Định danh control plane: lúc cài sinh `cp_instance_id`, cặp khoá Ed25519 của control plane (dùng ở phase 2) và `cp_epoch` (UUID, đổi mỗi lần restore từ backup — phase 2 dùng)."
          },
          {
           "text": "TLS: control plane tự nghe 80/443 và xin cert cho domain của nó bằng `internal/cp/certs` (lego v5, HTTP-01) — cùng package phase 4 mở rộng cho domain của app. Không dùng Caddy. Tuỳ chọn chạy sau proxy ngoài (tắt TLS, khai báo trusted proxy)."
          },
          {
           "text": "Chính sách URL đi ra (`internal/cp/netpolicy`): mọi URL do người dùng nhập (base URL Git, webhook thông báo, endpoint S3 custom, git URL) chỉ cho `https`, chặn link-local/RFC1918/dải WireGuard/loopback trừ khi admin cho phép, không theo redirect, không trả nội dung response trong thông báo lỗi."
          },
          {
           "text": "Web: React + Vite + TypeScript, TanStack Router + TanStack Query, Tailwind + shadcn/ui; build nhúng bằng `go:embed`."
          },
          {
           "text": "Cài control plane: `deploy/controlplane/docker-compose.yml` (controlplane + Postgres); `deploy/install-controlplane.sh` sinh master key, khoá Ed25519, setup token, `.env`, rồi `docker compose up -d`."
          },
          {
           "text": "Lab test: `test/lab/incus-up.sh` dựng 3 VM Incus (Ubuntu LTS, Docker) để các phase 2–10 kiểm trên kernel thật."
