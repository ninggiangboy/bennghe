           "text": "Metrics: gopsutil + tóm tắt docker stats mỗi 15 giây; control plane giữ raw 24 giờ (biểu đồ 24 giờ trên trang node), không rollup; cảnh báo dùng mẫu mới nhất."
          },
          {
           "text": "RBAC/audit: mọi route mới (cụm, node, join token, enroll, xác nhận đổi IP, xác nhận nhận lại sau đổi epoch) có `x-permission` và gọi `audit.Record`; phát sự kiện `node.offline`, `node.disk_high` qua `events.Emit`."
