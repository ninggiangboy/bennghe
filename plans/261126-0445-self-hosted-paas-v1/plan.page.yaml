         "type": "list",
         "title": "Yêu cầu",
         "items": [
          {
           "text": "Protocol: `proto/agent/v1/*.proto` (buf). `Envelope{id, correlation_id, oneof payload}`. Hello mang `agent_version`, `protocol_version`, thông tin node. Control plane hỗ trợ đầy đủ protocol N và N-1. Agent cũ hơn N-1 vẫn được xác thực nhưng chỉ nhận `SelfUpdate` (kênh chỉ-cập-nhật đóng băng, mọi phiên bản protocol phải giữ)."
          },
          {
           "text": "Kênh: WebSocket qua TLS dùng `github.com/coder/websocket`; payload protobuf; ping 20 giây. Không dùng gRPC/mTLS: gRPC không đi qua hostname của Cloudflare Tunnel, client cert mTLS không đi qua proxy Cloudflare (research-02 mục 4, 9)."
          },
          {
           "text": "Xác thực hai chiều (theo research-02 mục 9): Agent ký thông điệp có domain separation: `\"bn-agent-auth-v1\" || nonce || agent_id || server_host || timestamp`. Control plane ký transcript bằng khoá Ed25519 của nó (sinh ở phase 1); agent ghim fingerprint khoá này lúc enroll (`--cp-key <fp>` trong lệnh cài) và từ chối control plane không khớp. Mọi `DesiredState` mang `cp_epoch`, `revision` và chữ ký của control plane; agent từ chối bản không có chữ ký hợp lệ."
          },
          {
           "text": "Phân quyền theo loại message (`internal/cp/agentgw/authz.go`): bảng loại payload × vai trò node × cụm. Join token Swarm chỉ nhận từ node mà control plane đang coi là leader; kết quả job chỉ nhận cho job thuộc cụm của node; thay đổi IP public của node ingress tạo sự kiện chờ admin xác nhận, không tự sửa DNS/peer. Session mới cho cùng node chỉ thay session cũ sau khi bắt tay thành công; đổi session quá 3 lần/phút phát sự kiện cảnh báo."
          },
          {
           "text": "Enroll: admin tạo join token (dùng một lần, TTL 1 giờ, lưu hash) cho một cụm. Lệnh cài lấy script và binary từ GitHub Releases (không phải từ control plane), kiểm SHA-256 + chữ ký minisign bằng public key ghim trong script: `curl -fsSL https://github.com/<org>/bennghe/releases/download/vX/install-agent.sh | sudo sh -s -- --cp https://<cp> --cp-key <fp> --token <t>`. Script cài Docker nếu thiếu (Engine hỗ trợ API ≥ 1.44), wireguard-tools, systemd unit, rồi `agent enroll`."
          },
          {
           "text": "Định danh agent: khoá Ed25519 chỉ nằm ở file `/var/lib/bennghe-agent/identity.key` (0600) — một nguồn duy nhất, không lưu trong bbolt."
          },
          {
           "text": "Desired state + reconcile: Trạng thái cấp node (WG, firewall, file trên node, container buildkitd/registry) do agent của chính node áp. Trạng thái cấp cụm (service, network, secret, config Swarm) chỉ do agent trên node đang là Swarm leader áp; leader đổi thì reconciler chuyển theo. Mọi `ServiceUpdate` gửi kèm version index của spec; xung đột version thì quan sát lại, không retry mù. Trong cùng epoch, agent từ chối revision thấp hơn bản đã áp. Đổi epoch (control plane được restore): agent vào chế độ \"nhận lại\" — gửi toàn bộ observed state, tạm dừng mọi thao tác xoá (gỡ peer, xoá service/secret, thu hồi node) cho tới khi admin xác nhận trên UI."
          },
          {
           "text": "Local state: bbolt `state.db` chứa outbox và desired state gần nhất. Outbox có trần dung lượng (mặc định 256 MB) với 3 lớp ưu tiên: kết quả job + exit code không bao giờ bị bỏ; log bị cắt chỉ giữ đuôi; metrics bị bỏ trước. Agent từ chối khởi chạy job mới khi disk > 95% và ghi sự kiện cục bộ."
          },
          {
           "text": "Reconnect: exponential backoff có jitter, tối đa 60 giây."
          },
          {
           "text": "Tự cập nhật: Ký bằng minisign (chốt ở phase này, thư viện `aead.dev/minisign`); public key phát hành nhúng trong agent; không cần interface `Verifier`. Chống hạ cấp: từ chối cập nhật về version thấp hơn trừ khi có cờ ghi đè cục bộ trên node. Watchdog trong binary: bản mới phải đạt trạng thái \"đã kết nối + đã reconcile\" trong 120 giây, nếu không thì tự thoát mã khác 0; systemd `WatchdogSec` + `ExecStartPre` khôi phục bản cũ. Triển khai lần lượt từng node trong cụm, node đang là Swarm leader cập nhật sau cùng."
