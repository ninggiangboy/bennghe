       "text": "Tên sản phẩm Bennghe (từ Bến Nghé — bến cảng xưa của Sài Gòn); module `github.com/<org>/bennghe`; prefix kỹ thuật `bn` (nhãn `bn.*`, interface `bn-wg0`, đường dẫn `/var/lib/bennghe-agent`). Cần kiểm tra tên còn trống trên GitHub/domain trước khi public."
      },
      {
       "text": "Open source, self-hosted, single-tenant; một control plane quản lý nhiều cụm. AGPL-3.0."
      },
      {
       "text": "Go cho control plane + agent; React + Vite cho UI (nhúng vào binary)."
      },
      {
       "text": "Control plane + agent; agent kết nối ra (WebSocket + TLS), xác thực hai chiều Ed25519, desired state có chữ ký."
      },
