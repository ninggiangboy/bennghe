   "type": "section",
   "title": "Lộ trình",
   "blocks": [
    {
     "type": "timeline",
     "items": [
      {
       "when": "Tuần 0–4",
       "title": "Phase 1: Foundation",
       "text": "Có monorepo chạy được: control plane Go phục vụ SPA React qua TLS của chính nó, đăng nhập có bảo vệ màn hình setup, RBAC theo scope với cổng CI bắt mọi route khai báo quyền, audit cho cả thao tác thành công lẫn bị từ chối, contract phát sự kiện, job queue, lab test Incus, và CI xanh."
      },
      {
       "when": "Tuần 4–7",
       "title": "Phase 2: Agent & Transport",
       "text": "Agent Go cài bằng một lệnh, enroll bằng token dùng một lần, xác thực **hai chiều** với control plane qua WebSocket, chỉ áp desired state có chữ ký của control plane, có một reconciler duy nhất cho trạng thái cấp cụm, tự cập nhật an toàn (watchdog, chống hạ cấp, kênh chỉ-cập-nhật cho agent quá cũ), …"
      },
      {
       "when": "Tuần 7–10",
       "title": "Phase 3: Cluster Networking",
       "text": "Node trong một cụm (có thể khác nhà cung cấp) được nối bằng WireGuard full mesh, chạy Docker Swarm trên IP WireGuard, **sống sót qua reboot khi control plane offline**, chỉ nhận workload sau khi được chuẩn bị xong, có firewall đúng, và được thêm/gỡ an toàn (kể cả node chạy database hay manager). Đâ…"
      },
      {
       "when": "Tuần 10–13",
       "title": "Phase 4: Ingress & Certificates",
       "text": "Mỗi cụm có Traefik làm ingress trên các node gắn nhãn ingress, **chỉ đọc cấu hình do agent sinh ra** (không chạm Docker API); control plane cấp và gia hạn chứng chỉ tập trung (HTTP-01 và DNS-01 Cloudflare, có wildcard); domain có chủ sở hữu rõ ràng, không thể bị project khác chiếm; record DNS Cloud…"
      },
      {
       "when": "Tuần 13–17",
       "title": "Phase 5: Build & Deploy",
       "text": "Deploy app từ image, Dockerfile hoặc mã nguồn (Railpack) thành Swarm service có replica, HTTPS, env/secret, rolling update chờ healthcheck, tự rollback, rollback tay trả lại **toàn bộ cấu hình** của bản trước; các deployment của cùng một app chạy tuần tự; mọi workload đi qua chính sách kiểm duyệt v…"
      },
      {
       "when": "Tuần 17–21",
       "title": "Phase 6: Git Providers",
       "text": "Tích hợp native GitHub (GitHub App), GitLab và Gitea/Forgejo: kết nối tài khoản, chọn repo từ danh sách, tự tạo webhook, push lên branch thì tự deploy, và cập nhật commit status theo kết quả deployment."
      },
      {
       "when": "Tuần 21–25",
       "title": "Phase 7: Databases & Backups",
       "text": "Tạo Postgres, MySQL, MongoDB, Redis bằng một thao tác trong network riêng; backup lên S3-compatible (AWS, R2, B2, MinIO) có mã hoá, retention, credential đặt trong cụm an toàn để backup chạy được khi control plane offline; restore vào database mới. Lịch backup chạy qua scheduler ở phase 8."
      },
      {
       "when": "Tuần 25–27",
       "title": "Phase 8: Scheduler, Cron & Notifications",
       "text": "Cron job và lịch backup chạy đúng giờ khi control plane offline, chịu được đổi leader và agent leader chết, không chạy trùng; có lịch sử, log và thông báo qua Telegram, Slack, email, webhook. Đây là mốc **alpha3**."
      },
      {
       "when": "Tuần 27–29",
       "title": "Phase 9: Compose & Templates",
       "text": "Deploy stack từ docker-compose (dán vào hoặc lấy từ Git) lên Swarm sau một bước biến đổi **dùng chung quy tắc của `servicespec`** (kiểm duyệt, route, secret, network, MTU, ghim volume), có cập nhật tuần tự và rollback theo revision; thư viện template cài bằng một thao tác."
      },
      {
       "when": "Tuần 29–32",
       "title": "Phase 10: Team UI & Cloudflare Tunnel",
       "text": "Quản lý team (mời, phân vai trò theo cụm/project, gỡ người), xem audit log; và expose app qua Cloudflare Tunnel cho cụm không mở 80/443."
      },
      {
       "when": "Tuần 32–35",
       "title": "Phase 11: E2E & Release",
       "text": "Bộ test end-to-end chứng minh mọi tiêu chí Done của plan, pipeline phát hành có ký số, tài liệu cài đặt/nâng cấp/khôi phục, và bản v1.0."
      }
     ]
    },
    {
     "type": "callout",
     "tone": "info",
     "title": "Mốc alpha",
     "text": "alpha1 sau phase 3 (~tuần 10): cụm chạy được. alpha2 sau phase 5 (~tuần 17): deploy app. alpha3 sau phase 8 (~tuần 27): database, backup, cron. v1.0 sau phase 11 (~tuần 36)."
    }
   ]
