           "text": "MTU cho mọi overlay: `daemon.json` trên mọi node đặt `default-network-opts.overlay.com.docker.network.driver.mtu=<MTU cụm>` để mọi overlay — kể cả network do stack tự tạo — kế thừa [UNVERIFIED: kiểm trong lab rằng Docker 29 áp tuỳ chọn này cho overlay]; các network do platform tạo vẫn đặt tường minh. Network `ingress` được tạo lại với cùng MTU ngay sau `swarm init`. Trước khi join, agent đo path MTU tới các peer; nếu nhỏ hơn MTU cụm thì từ chối join và chỉ cho phép qua thao tác bảo trì \"hạ MTU cụm\" (có ghi rõ là gây gián đoạn vì phải tạo lại network)."
