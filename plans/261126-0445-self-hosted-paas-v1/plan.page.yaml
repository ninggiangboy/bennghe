   "type": "section",
   "title": "Quyết định đã chốt",
   "blocks": [
    {
     "type": "list",
     "items": [
      {
       "text": "Tên sản phẩm Bennghe (từ Bến Nghé — bến cảng xưa của Sài Gòn); module `github.com/<org>/bennghe`; prefix kỹ thuật `bn` (nhãn `bn.*`, interface `bn-wg0`, đường dẫn `/var/lib/bennghe-agent`). Cần kiểm tra tên còn trống trên GitHub/domain trước khi public."
      },
      {
       "text": "Open source, self-hosted, single-tenant; một control plane quản lý nhiều cụm. AGPL-3.0."
      },
      {
       "text": "Rust cho control plane + agent (người dùng chốt 2026-11-26, thay quyết định Go trước đó); React + Vite cho UI (nhúng vào binary bằng `rust-embed`). Lý do duy nhất: agent phải ≤ 10 MB RSS khi rảnh trên VPS 512 MB. Quyết định có điều kiện: hiệu lực sau khi cổng spike ở phase 1 đạt; nếu agent Rust không đạt 10 MB hoặc agent Go đã ≤ 10 MB thì dừng và hỏi người dùng. Hệ quả đã chấp nhận: API chuyển từ spec-first sang code-first (`utoipa` sinh spec, `x-permission` vẫn bắt buộc), compose parser và bước DNS-01 Cloudflare tự viết, `buildctl` chạy trong container thay cho BuildKit client, AI viết code nên người dùng chịu việc review/gỡ lỗi Rust."
      },
      {
       "text": "Control plane + agent; agent kết nối ra (WebSocket + TLS), xác thực hai chiều Ed25519, desired state có chữ ký."
      },
      {
       "text": "Mỗi cụm là Docker Swarm trên WireGuard full mesh; node có thể khác nhà cung cấp."
      },
      {
       "text": "Registry nội bộ mỗi cụm + build node."
      },
      {
       "text": "Git native: GitHub App (GitHub.com + GHES), GitLab, Gitea; Forgejo best-effort qua adapter Gitea."
      },
      {
       "text": "Cloudflare: DNS tự động, DNS-01/wildcard, Tunnel, preset R2."
      },
      {
       "text": "Toàn bộ 12 nhóm tính năng trong v1 (scope: HOLD)."
      },
      {
       "text": "Project là ranh giới cách ly bảo mật thật trong một cụm (chốt ở red-team 2026-11-26)."
      },
      {
       "text": "Bổ sung từ so sánh Dokploy (người dùng chọn 2026-11-26, [báo cáo](../reports/xia-261126-1619-dokploy-comparison.md)): 2FA TOTP, xác thực lại 5 phút cho thao tác nhạy cảm, API token cho CI (phase 1); cert tải lên `tls_mode=custom` (phase 4); huỷ deployment, stream log build, giới hạn build song song, dọn Docker trên node, biến `${{project.KEY}}` (phase 5); watch paths (phase 6); backup volume có dừng service (phase 7); cảnh báo CPU/RAM (phase 8); generator base64/uuid/jwt (phase 9); preview deployment theo PR thành phase 11 mới, E2E & Release chuyển thành phase 12. Chỉ lấy ý tưởng; không chép mã, không dùng phần `/proprietary` của Dokploy."
      }
     ]
    }
   ]
  },
