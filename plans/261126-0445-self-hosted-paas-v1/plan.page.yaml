        {
         "type": "text",
         "variant": "lead",
         "text": "Tích hợp native GitHub (GitHub App), GitLab và Gitea/Forgejo: kết nối tài khoản, chọn repo từ danh sách, tự tạo webhook, push lên branch thì tự deploy, và cập nhật commit status theo kết quả deployment."
        },
        {
         "type": "list",
         "title": "Yêu cầu",
         "items": [
          {
           "text": "Interface chung (ba biến thể thật):"
          },
          {
           "text": "GitHub: GitHub App Manifest flow: người dùng bấm \"Tạo GitHub App\", control plane POST manifest (webhook URL, quyền contents:read, metadata:read, statuses:write, pull_requests:read; đăng ký sự kiện `push` và `pull_request` — hai mục sau dùng ở phase 11, xin ngay từ đầu để người dùng không phải duyệt lại quyền App) , nhận code, đổi lấy app id + private key + webhook secret + client secret, lưu mã hoá; sau đó cài App vào tài khoản/org. Clone bằng installation token. Kiểm `X-Hub-Signature-256`. Hỗ trợ GitHub Enterprise Server trong v1 (người dùng chốt ở Validation Session 1): endpoint đổi code là `https://HOSTNAME/api/v3/app-manifests/{code}/conversions` (có tài liệu); URL form tạo App trên GHES (`https://HOSTNAME/settings/apps/new`) là suy luận [UNVERIFIED: cần test trên GHES thật]."
          },
          {
           "text": "GitLab: OAuth2 application có PKCE (gitlab.com hoặc self-managed theo base URL), lưu access + refresh token mã hoá; access token sống 2 giờ và mỗi lần refresh đổi cả hai token, nên việc refresh phải nằm trong transaction có khoá dòng để hai worker không refresh đồng thời; project hook với secret token (`X-Gitlab-Token`); commit status API; clone bằng OAuth token."
          },
          {
           "text": "Gitea/Forgejo: Forgejo ở mức best-effort qua adapter Gitea (Validation Session 1): chạy chung bộ test Gitea trong job nightly mang tính tham khảo, không chặn phát hành khi lệch. OAuth2 application theo base URL; repo webhook với secret, kiểm HMAC-SHA256 qua `X-Gitea-Signature` (Forgejo gửi cả `X-Forgejo-Signature` lẫn `X-Gitea-Signature`, nên một adapter dùng chung; API OAuth/webhook/status chưa lệch nhau theo research-02 mục 3); clone bằng OAuth token trên Forgejo [UNVERIFIED: cần test tích hợp]; commit status API."
          },
          {
           "text": "Webhook endpoint `/webhooks/{provider}/{connection-id}`: Kiểm chữ ký đồng bộ trước khi đưa vào hàng đợi; so sánh constant-time (kể cả `X-Gitlab-Token`); từ chối hook Gitea có secret rỗng. Khử trùng theo `(connection, ref, after_sha)` ngoài delivery ID (delivery ID không nằm trong phần được ký nên không chống replay). Trước khi deploy, hỏi API provider để xác nhận SHA vẫn là đầu branch; nếu không thì bỏ qua (chống replay payload cũ). `EnsureWebhook` luôn đăng ký cả sự kiện push lẫn pull/merge request (idempotent: cập nhật hook đã có); bộ xử lý phân loại theo loại sự kiện và trả 2xx bỏ qua với mọi sự kiện không phải push cho tới khi phase 11 thêm bộ xử lý PR. Trả 2xx nhanh rồi xử lý qua job queue; deployment đi qua hàng đợi tuần tự của app (phase 5)."
          },
          {
           "text": "Push vào branch theo dõi thì tạo deployment; commit status `pending` khi bắt đầu, `success`/`failure` khi kết thúc, `error` với mô tả \"đã huỷ\" khi `cancelled` và \"được thay thế\" khi `superseded`, link về trang deployment."
