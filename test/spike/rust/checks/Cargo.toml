[package]
name = "bn-spike-checks"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }
bollard = { version = "0.21", default-features = false, features = ["http", "pipe"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "json"] }
graphile_worker = "0.15"
utoipa = { version = "6", features = ["yaml"] }
wireguard-control = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
