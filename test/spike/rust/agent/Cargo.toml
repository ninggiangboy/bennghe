[package]
name = "bn-spike-agent"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "macros"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
prost = { version = "0.14", default-features = false, features = ["derive", "std"] }
bollard = { version = "0.21", default-features = false, features = ["pipe", "http"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
mimalloc = { version = "0.1", optional = true }

[features]
mimalloc = ["dep:mimalloc"]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
