[package]
name = "bn-cp"
description = "Bennghe control plane"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "bn_cp"
path = "src/lib.rs"

[[bin]]
name = "controlplane"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.105"
arc-swap = "1.9.5"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base32 = "0.5.1"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.10", features = ["derive", "env"] }
ed25519-dalek = { version = "3.0.0", features = ["rand_core", "pkcs8"] }
getrandom = "0.4.3"
graphile_worker = "0.15.0"
hmac = "0.13.0"
hyper = "1.13.0"
hyper-util = { version = "0.1.21", features = ["server-auto", "service", "tokio"] }
instant-acme = { version = "0.8.5", default-features = false, features = ["hyper-rustls", "ring", "x509-parser"] }
ipnet = { version = "2.12.2", features = ["serde"] }
mime_guess = "2.0.5"
rust-embed = "8.14.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.2"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "macros", "sqlx-toml"] }
subtle = "2.6.1"
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "fs", "sync"] }
tokio-rustls = "0.26.6"
toml = "1.2.3"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "request-id", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.9"
utoipa = { version = "6.0.0", features = ["yaml", "chrono", "uuid"] }
utoipa-axum = "0.3.0"
uuid = { version = "1.29.3", features = ["v4", "serde"] }
x509-parser = "0.18.1"

[dev-dependencies]
http-body-util = "0.1.5"
rcgen = "0.14.10"
tower = { version = "0.5.3", features = ["util"] }
